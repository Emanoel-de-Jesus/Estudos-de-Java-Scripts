<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        Body {
            Font : normal 20pt arial;
        }
    </style>
</head>
<body>
    <script>
    var nome = window.prompt('Qual é seu nome?')
document.writeln(`Olá, <strong>${nome}</strong>, Seu nome tem ${nome.length} letras.`)
    document.writeln(`Seu nome em minusculo é ${nome.toLowerCase()}<br>`);
    document.writeln(`Seu nome em maiusculo é ${nome.toUpperCase()}`);
    document.write(`Seu nome em minusculo é ${nome.toLowerCase()}<br>`);
    </script>
</body>
</html>
